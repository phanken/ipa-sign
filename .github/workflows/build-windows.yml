name: Build IPA Signer Pro Windows v5

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify source
        shell: pwsh
        run: |
          $files = @(
            "src\IPASignerPro\IPASignerPro.csproj",
            "src\IPASignerPro\MainForm.cs",
            "src\IPASignerPro\Program.cs",
            "src\IPASignerPro\app.manifest"
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "Missing source: $f" }
          }

      - name: Publish GUI
        run: >
          dotnet publish src/IPASignerPro/IPASignerPro.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Create tools folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force publish\tools | Out-Null

      - name: Download exact Sideloader-compatible Windows runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/libimobiledevice-win32/imobiledevice-net/releases/download/v1.3.17/libimobiledevice.1.2.1-r1122-win-x64.zip"
          $zip = "$env:RUNNER_TEMP\limd.zip"
          $dir = "$env:RUNNER_TEMP\limd"

          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive $zip $dir -Force

          Get-ChildItem $dir -Recurse -File |
            Where-Object { $_.Extension -eq ".dll" } |
            ForEach-Object { Copy-Item $_.FullName publish\tools\ -Force }

          if (-not (Test-Path "publish\tools\plist.dll")) {
            Write-Host "Files copied:"
            Get-ChildItem publish\tools | Select-Object Name,Length | Format-Table
            throw "plist.dll not found after extracting exact runtime package."
          }

      - name: Copy Sideloader executable
        shell: pwsh
        run: |
          if (Test-Path "tools\sideloader.exe") {
            Copy-Item "tools\sideloader.exe" "publish\tools\sideloader.exe" -Force
          } elseif (Test-Path "tools\sideloader-cli-windows-x86_64.exe") {
            Copy-Item "tools\sideloader-cli-windows-x86_64.exe" "publish\tools\sideloader.exe" -Force
          } else {
            throw "Put Sideloader Windows executable at tools\sideloader.exe before running Actions."
          }

      - name: Final runtime verification
        shell: pwsh
        run: |
          $required = @(
            "publish\tools\sideloader.exe",
            "publish\tools\plist.dll"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Missing required file: $f" }
          }

          Write-Host "=== FINAL tools folder ==="
          Get-ChildItem publish\tools -File |
            Sort-Object Name |
            Select-Object Name,Length |
            Format-Table -AutoSize

      - name: Copy docs
        shell: pwsh
        run: |
          Copy-Item README.md publish\README.txt -Force
          Copy-Item README-v5.txt publish\README-v5.txt -Force

      - name: Upload ready-to-run package
        uses: actions/upload-artifact@v4
        with:
          name: IPA-Signer-Pro-Windows-v5-Full
          path: publish/
          if-no-files-found: error
          retention-days: 30
