name: Build IPA Signer Pro Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish portable Windows x64
        run: >
          dotnet publish src/IPASignerPro/IPASignerPro.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish\tools | Out-Null
          Copy-Item README.md publish\README.txt
          Copy-Item BACKEND-HUONG-DAN.md publish\BACKEND-HUONG-DAN.txt

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: IPA-Signer-Pro-Windows
          path: publish/
          if-no-files-found: error
          retention-days: 30
